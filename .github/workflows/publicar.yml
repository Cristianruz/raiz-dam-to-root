# AI-assisted (Claude Code) — ROOT, NASA Space Apps 2026
# Comando único + pruebas en cada push y pull request; publica web/ en GitHub Pages
# SOLO en push a main y SOLO si el job de pruebas pasó (kit v4 §0.2 y K-INT).
# Requisito del repo: Settings → Pages → Source: «GitHub Actions».
name: Construir, probar y publicar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Comando único y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repo
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias (versiones exactas)
        run: python -m pip install -r requirements.txt

      - name: Comando único (contrato, manifest, pytest y node --test)
        run: python construir.py

      # Se sube la carpeta web/ que acaba de pasar las pruebas (con su manifest.json generado).
      - name: Empaquetar web/ para GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  auditoria:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el repo
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit sobre requirements.txt
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  publicar:
    name: Publicar en GitHub Pages
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
